# TEMPLATE ONLY — not applied via Flux (see kustomization.yaml).
#
# Phoenix needs SECRET_KEY_BASE to sign/encrypt session cookies and
# LiveView state. Create the real Secret out of band before the first
# deploy (so Flux doesn't fight an operator-managed value):
#
#   kubectl create secret generic grocery-aid-app-secrets -n grocery-aid \
#     --from-literal=SECRET_KEY_BASE="$(mix phx.gen.secret)"
#
# This file documents the expected key set; the value below is a
# placeholder (base64 of "changeme").
apiVersion: v1
kind: Secret
metadata:
  name: grocery-aid-app-secrets
  namespace: grocery-aid
type: Opaque
data:
  SECRET_KEY_BASE: Y2hhbmdlbWU=
