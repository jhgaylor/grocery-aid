apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  # secret.yaml is a template only — the real `grocery-aid-app-secrets`
  # Secret (SECRET_KEY_BASE) is created out of band via
  # `kubectl create secret generic`. Not included here so Flux doesn't
  # overwrite the live value.
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - certificates.yaml
