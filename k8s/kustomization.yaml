apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - postgres.yaml
  # Runtime secrets come from the self-hosted Infisical (magpie). The operator
  # authenticates with the SOPS-encrypted machine-identity creds and
  # materializes the `grocery-aid-app-secrets` Secret (SECRET_KEY_BASE) the
  # Deployment consumes. DATABASE_URL comes from CNPG's `grocery-aid-pg-app`.
  - infisicalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - certificates.yaml
