# Pulls runtime secrets from the self-hosted Infisical (magpie) `grocery-aid`
# project and materializes them into a native K8s Secret
# (`grocery-aid-app-secrets`) that the Deployment reads via envFrom.
# DATABASE_URL is NOT here — it comes from the CNPG-generated
# `grocery-aid-pg-app` Secret. This project holds SECRET_KEY_BASE (and is the
# home for any future API keys: recipe import, shopping-site integrations).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grocery-aid-secrets
  namespace: grocery-aid
spec:
  # Internal Service DNS — no Traefik/Cloudflare round-trip for in-cluster reconciles.
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    # Kubernetes-native auth: no stored credential (see home-cloud
    # docs/sops-to-infisical-migration.md, Phase 2 pattern).
    kubernetesAuth:
      # grocery-aid-operator machine identity on the Infisical server.
      identityId: f4535394-1393-4784-abe3-6f96c147cffa
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: grocery-aid-infisical
        namespace: grocery-aid
      secretsScope:
        projectSlug: grocery-aid-ff-lh
        envSlug: prod
        secretsPath: "/"
  managedSecretReference:
    secretName: grocery-aid-app-secrets
    secretNamespace: grocery-aid
    # Orphan = operator overwrites in-place / the Secret survives CR deletion.
    creationPolicy: Orphan
